<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Katalog Kit · Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=block">
<link rel="stylesheet" href="../halaman/kerangka.css">
<style>
  /* Kepala halaman katalog dan teks bantu. Warna hanya dari token tema. */
  #katalog-kepala { position: absolute; left: 60px; top: 56px; width: 960px; text-align: center; }
  .kk-merek { font: 700 20px/1 var(--mono); letter-spacing: 0.32em; padding-left: 0.32em; color: var(--emas); }
  .kk-judul { margin-top: 18px; font: 700 54px/1.1 var(--serif); color: var(--krem); }
  .kk-info { margin-top: 16px; font: 600 22px/1.3 var(--mono); color: color-mix(in srgb, var(--krem) 62%, transparent); }
  .kk-info b { font-weight: inherit; color: var(--zamrud-terang); }
  .kk-pesan { position: absolute; left: 90px; top: 760px; width: 900px; text-align: center; display: none;
    font: 600 40px/1.3 var(--sans); color: var(--krem); }
  .kk-pesan small { display: block; margin-top: 18px; font: 500 20px/1.4 var(--mono); color: color-mix(in srgb, var(--krem) 55%, transparent);
    white-space: pre-wrap; }
  .kk-zona { position: absolute; left: 0; width: 100%; border-top: 2px dashed color-mix(in srgb, var(--abu) 55%, transparent); }
  .kk-zona span { position: absolute; right: 24px; top: 6px; font: 600 15px/1 var(--mono); color: color-mix(in srgb, var(--abu) 90%, transparent); }
  .lbl-benda.katalog-nama { font-size: 25px; color: color-mix(in srgb, var(--krem) 92%, transparent); }
  .lbl-benda.katalog-nama.gagal { color: var(--abu); }
  .lbl-mikro.katalog-catatan { white-space: pre; text-align: center; line-height: 1.35; }
</style>
</head>
<body>
<script type="module" src="./katalog.js"></script>
</body>
</html>
